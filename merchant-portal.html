<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品发布 · 审核结果与整改</title>
<!--
  商家上传端原型（提交后：审核结果 + 整改 + 补证 + 复提）
  数据：内嵌 eval/cases_json 的 5 个金标用例快照（不接真模型、不 fetch）
  设计 token 与「审核工作台/index.html」保持一致（Linear 极简灰）
-->
<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#f3f4f7;
    --surface-3:#eaecf1;
    --border:#e5e7ec;
    --border-2:#d6d9e0;
    --text:#191b20;
    --text-2:#545964;
    --text-3:#6b7280;
    --text-4:#7f8691;
    --accent:#5b62d4;
    --accent-bg:#eef0fc;
    --accent-border:#d8dcf3;
    --pass:#1f9d57;    --pass-bg:#e8f8ee;    --pass-border:#c2e9d1;
    --warn:#b0750e;    --warn-bg:#fdf2dd;    --warn-border:#efdab2;
    --review:#6d54d6;  --review-bg:#f0ecfc;  --review-border:#dcd2f4;
    --block:#d23b32;   --block-bg:#fdecea;   --block-border:#f4c8c3;
    --recheck:#5b6b7a; --recheck-bg:#eef1f4; --recheck-border:#d4dce3;
    --r:11px; --r-sm:8px; --r-xs:6px;
    --hdr-h:58px;
    --shadow-sm:0 1px 2px rgba(22,24,30,.04),0 1px 3px rgba(22,24,30,.06);
    --shadow-md:0 2px 8px rgba(22,24,30,.07),0 10px 28px rgba(22,24,30,.07);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:13px;line-height:1.6;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
    padding-bottom:84px;
  }
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}

  /* ============ 顶栏（商家中心） ============ */
  .app-header{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.86);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .hdr{max-width:1560px;margin:0 auto;padding:0 22px;height:var(--hdr-h);display:flex;align-items:center;gap:20px;}
  .brand{display:flex;align-items:center;gap:10px;flex:none;}
  .brand-mark{
    width:28px;height:28px;border-radius:8px;flex:none;
    background:linear-gradient(150deg,#6b73e0,#4b52c4);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-sm);
  }
  .brand-name{font-size:15px;font-weight:700;letter-spacing:-.01em;}
  .brand-sub{font-size:12px;color:var(--text-3);}
  .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);min-width:0;}
  .crumb b{color:var(--text);font-weight:600;}
  .crumb .sep{color:var(--text-4);}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--text-3);flex:none;}
  .hdr-link{cursor:pointer;display:inline-flex;align-items:center;gap:5px;position:relative;}
  .hdr-link:hover{color:var(--text);}
  .hdr-link .rdot{width:6px;height:6px;border-radius:50%;background:var(--block);}
  /* 顶栏右侧：商家角色切换 */
  .shop-sw{position:relative;}
  .shop-chip{
    display:inline-flex;align-items:center;gap:7px;font-family:inherit;cursor:pointer;
    font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;
    background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-sm);
    padding:5px 11px;
    transition:background .14s ease,border-color .14s ease,box-shadow .14s ease;
  }
  .shop-chip:hover{background:var(--surface-2);}
  .shop-chip.open{border-color:var(--accent-border);box-shadow:var(--shadow-sm);}
  .shop-chip::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);flex:none;}
  .shop-chip .sw-n{max-width:190px;overflow:hidden;text-overflow:ellipsis;}
  .shop-chip .sw-c{flex:none;font-size:9px;color:var(--text-4);transition:transform .16s ease;}
  .shop-chip.open .sw-c{transform:rotate(180deg);}
  .shop-pop{
    position:absolute;right:0;top:calc(100% + 12px);z-index:5;width:300px;
    background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r);
    box-shadow:var(--shadow-md);padding:6px;max-height:360px;overflow:auto;
  }
  .sp-head{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.03em;padding:6px 10px 7px;}

  /* ============ 外壳：左导航 + 内容 ============ */
  .shell{max-width:1560px;margin:0 auto;display:flex;align-items:flex-start;gap:22px;padding:0 22px;}

  /* ============ 左侧导航 ============ */
  .side{width:208px;flex:none;position:sticky;top:var(--hdr-h);max-height:calc(100vh - var(--hdr-h));overflow:auto;padding:16px 0 24px;}
  .side-nav{display:flex;flex-direction:column;gap:2px;}
  .nav-t{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;color:var(--text-3);padding:13px 12px 6px;}
  .nav-t svg,.nav-item svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .nav-item{
    display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-2);
    padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;
    transition:background .14s ease,color .14s ease,border-color .14s ease;
  }
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.on{background:var(--surface);color:var(--accent);font-weight:600;border-color:var(--accent-border);box-shadow:var(--shadow-sm);}
  .nav-item.sub{padding-left:12px;margin-left:24px;}
  .nav-badge{
    margin-left:auto;min-width:17px;height:17px;padding:0 5px;border-radius:9px;
    background:var(--block);color:#fff;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .sp-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;
    transition:background .14s ease,border-color .14s ease;}
  .sp-item:hover{background:var(--surface-2);}
  .sp-item.on{background:var(--accent-bg);border-color:var(--accent-border);}
  .sp-dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:5px;}
  .sp-main{flex:1;min-width:0;}
  .sp-n{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sp-s{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.5;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ============ 内容区 ============ */
  .content{flex:1;min-width:0;padding:18px 0 90px;}
  .page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px;}
  .ph-main{min-width:0;}
  .ph-title{font-size:20px;font-weight:700;letter-spacing:-.02em;}
  .ph-meta{font-size:12px;color:var(--text-3);margin-top:5px;line-height:1.65;}
  .ph-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none;padding-top:3px;}
  .ph-status{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid;}
  .ph-status.pass{color:var(--pass);background:var(--pass-bg);border-color:var(--pass-border);}
  .ph-status.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-border);}
  .ph-status.review{color:var(--review);background:var(--review-bg);border-color:var(--review-border);}
  .ph-status.block{color:var(--block);background:var(--block-bg);border-color:var(--block-border);}
  .ph-status.recheck{color:var(--recheck);background:var(--recheck-bg);border-color:var(--recheck-border);}
  .link-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer;padding:5px 2px;}
  .link-btn:hover{text-decoration:underline;}

  /* ============ 卡片 ============ */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;}
  .card-pad{padding:20px 22px;}
  .sec-head{display:flex;align-items:center;gap:9px;margin-bottom:3px;}
  .sec-title{font-size:15px;font-weight:600;letter-spacing:-.012em;}
  .sec-sub{font-size:12px;color:var(--text-3);margin-bottom:14px;}
  .sec-num{
    font-size:11px;font-weight:600;color:var(--text-3);
    background:var(--surface-3);border:1px solid var(--border);border-radius:var(--r-xs);
    padding:1px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  /* ============ 横向步骤条 ============ */
  .steps{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 20px;margin-bottom:16px;overflow:hidden;}
  .stp{display:flex;align-items:center;gap:9px;flex:none;}
  .stp-txt{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .stp-txt .stp-name{line-height:1.25;}
  .stp-txt .stp-note{line-height:1.25;}
  .stp-dot{
    width:22px;height:22px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
    background:var(--surface-3);color:var(--text-4);border:1px solid var(--border-2);
  }
  .stp.done .stp-dot{background:var(--pass-bg);color:var(--pass);border-color:var(--pass-border);}
  .stp.now .stp-dot{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border);}
  .stp.hold .stp-dot{background:var(--recheck-bg);color:var(--recheck);border-color:var(--recheck-border);}
  .stp-name{font-size:13px;font-weight:600;color:var(--text-3);white-space:nowrap;}
  .stp.done .stp-name{color:var(--text-2);}
  .stp.now .stp-name{color:var(--text);font-weight:700;}
  .stp-note{font-size:11px;color:var(--text-3);white-space:nowrap;}
  .stp-line{flex:1;height:1px;background:var(--border-2);margin:0 12px;min-width:12px;}

  /* ============ 双列 ============ */
  .cols{display:flex;align-items:flex-start;gap:16px;}
  .col-main{flex:1;min-width:0;}
  .col-rail{width:302px;flex:none;}

  /* ============ 驳回原因（键值行） ============ */
  .rej-head{display:flex;align-items:center;gap:9px;margin-bottom:3px;}
  .rej-badge{min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:var(--block);color:#fff;
    font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
  .rej-banner{
    display:flex;gap:9px;align-items:flex-start;margin:12px 0 2px;
    background:var(--block-bg);border:1px solid var(--block-border);color:#a8382f;
    border-radius:var(--r-sm);padding:10px 13px;font-size:13px;line-height:1.65;
  }
  .rej-item{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px 8px;margin-top:10px;}
  .ri-head{display:flex;align-items:center;gap:9px;padding-bottom:2px;}
  .ri-n{font-family:var(--mono);font-size:11px;color:var(--text-4);flex:none;}
  .ri-t{flex:1;min-width:0;font-size:13px;font-weight:600;letter-spacing:-.01em;}
  .kv{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:9px 0;border-top:1px dashed var(--border);font-size:13px;}
  .kv:first-child{border-top:none;}
  .kv-k{color:var(--text-3);}
  .kv-v{color:var(--text-2);line-height:1.7;min-width:0;word-break:break-word;}
  .quo{background:var(--block-bg);color:var(--block);border-radius:4px;padding:1px 5px;font-weight:600;}
  .rej-fix{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
  .rej-fix-t{font-size:13px;font-weight:600;margin-bottom:8px;}
  .rej-fix-list{display:flex;flex-direction:column;gap:6px;}
  .rej-fix-row{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-2);line-height:1.65;}
  .rej-fix-row .n{color:var(--text-4);flex:none;font-family:var(--mono);font-size:11px;margin-top:2px;}
  .mode-tag{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-xs);padding:2px 9px;
  }
  .mode-tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .mode-tag.degraded{color:#a8382f;background:var(--block-bg);border-color:var(--block-border);}
  .mode-tag.degraded::before{background:var(--block);}
  .mode-tag.plain{color:var(--text-3);background:transparent;border-style:dashed;}
  .mode-tag.plain::before{display:none;}
  .ts{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--text-3);}

  /* ============ 右栏：进度 + 时间线 ============ */
  .rail-prog{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px;}
  .rp-num{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;}
  .rp-num small{font-size:13px;font-weight:600;color:var(--text-3);letter-spacing:0;}
  .rp-note{font-size:12px;color:var(--text-3);line-height:1.6;padding-bottom:3px;}
  .tl{position:relative;padding-left:20px;}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:8px;width:1px;background:var(--border-2);}
  .tl-item{position:relative;padding-bottom:14px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-dot{position:absolute;left:-19px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--surface-3);border:2px solid var(--border-2);}
  .tl-dot.done{background:var(--pass);border-color:var(--pass);}
  .tl-dot.now{background:var(--accent);border-color:var(--accent);}
  .tl-dot.hold{background:var(--recheck);border-color:var(--recheck);}
  .tl-t{font-size:13px;font-weight:600;}
  .tl-d{font-size:12px;color:var(--text-3);line-height:1.6;margin-top:2px;}
  .rail-empty{font-size:13px;color:var(--text-3);line-height:1.75;}
  /* 剩余补证时间（原型示意） */
  .cd-num{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--block);display:flex;align-items:baseline;gap:5px;}
  .cd-num em{font-style:normal;font-size:13px;font-weight:600;letter-spacing:0;}
  .cd-bar{height:6px;border-radius:20px;background:var(--surface-3);overflow:hidden;margin:14px 0 10px;}
  .cd-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#e4776b,var(--block));}
  .cd-hint{font-size:12px;color:var(--text-3);line-height:1.65;}
  .cd-demo{font-size:11px;color:var(--text-4);line-height:1.6;margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);}

  /* ============ 底部操作栏 ============ */
  .act-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--border);box-shadow:0 -4px 18px rgba(22,24,30,.08);}
  .act-inner{max-width:1560px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:18px;}
  .act-lead{display:flex;align-items:center;gap:13px;min-width:0;flex:1;}
  .act-lead .prog-bar{max-width:220px;}
  .act-count{font-size:13px;color:var(--text-2);white-space:nowrap;}
  .act-count b{color:var(--text);font-weight:700;}
  .act-hint{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .act-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none;}
  .act-sep{width:1px;height:22px;background:var(--border-2);flex:none;}

  /* ============ 待办清单 ============ */
  .todo-group{margin-bottom:20px;}
  .todo-group:last-child{margin-bottom:0;}
  .tg-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .tg-name{font-size:13px;font-weight:600;}
  .tg-count{font-size:11px;color:var(--text-3);background:var(--surface-3);border-radius:20px;padding:1px 8px;}
  .todo{
    display:flex;gap:11px;align-items:flex-start;
    border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;
    transition:border-color .14s ease,background .14s ease;cursor:pointer;
  }
  .todo:hover{border-color:var(--border-2);background:#fcfcfd;}
  .todo:last-child{margin-bottom:0;}
  .todo.done{background:var(--pass-bg);border-color:var(--pass-border);}
  .todo-box{
    flex:none;width:16px;height:16px;margin-top:2px;border-radius:4px;
    border:1.5px solid var(--border-2);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;
  }
  .todo.done .todo-box{background:var(--pass);border-color:var(--pass);color:#fff;}
  .todo-main{min-width:0;flex:1;}
  .todo-title{font-size:13px;font-weight:600;line-height:1.55;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;}
  .todo.done .todo-title{color:var(--text-2);}
  .loc{
    flex:none;font-size:11px;font-weight:600;color:var(--text-2);
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-xs);
    padding:1px 7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;
  }
  .todo-body{font-size:12px;color:var(--text-2);line-height:1.7;margin-top:4px;}
  .todo-meta{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.7;}
  .todo-meta b{color:var(--text-2);font-weight:600;}
  /* 问题下方的内联处理区：整改/补证直接挂在对应问题下，不再另开一张待办卡 */
  .hit-act{margin-top:12px;border-top:1px dashed var(--border);padding-top:12px;}
  .hit-act .ha-h{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text-4);margin-bottom:7px;}
  .hit-act .ha-h + .todo{margin-top:0;}
  .hit-act .todo{margin-bottom:8px;}
  .hit-act .todo:last-child{margin-bottom:0;}
  .hit-note{
    font-size:12px;color:var(--text-3);line-height:1.7;
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;
  }
  .sup-up{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .sup-up .file{background:var(--surface-2);}
  .sup-up .fix-hint{margin-top:0;}
  .btn.tiny{font-size:12px;padding:4px 11px;font-weight:500;}
  /* 文字类整改：就地输入改后内容，点「提交修改」后同步刷新材料图 */
  .fix-input{
    width:100%;margin-top:9px;padding:7px 10px;font-size:13px;font-family:inherit;
    color:var(--text);background:var(--surface);border:1px solid var(--border-2);
    border-radius:var(--r-sm);cursor:text;transition:border-color .14s ease,box-shadow .14s ease;
  }
  .fix-input::placeholder{color:var(--text-4);}
  .fix-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
  .fix-hint{font-size:11px;color:var(--text-4);line-height:1.6;margin-top:6px;}
  .empty{
    border:1px dashed var(--border-2);border-radius:var(--r-sm);padding:18px;text-align:center;
    font-size:13px;color:var(--text-3);line-height:1.8;
  }

  /* ============ 进度 & 提交 ============ */
  .prog-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .prog-bar{flex:1;height:5px;border-radius:20px;background:var(--surface-3);overflow:hidden;}
  .prog-fill{height:100%;width:0;background:var(--accent);border-radius:20px;transition:width .22s ease;}
  .prog-txt{font-size:12px;color:var(--text-2);white-space:nowrap;}
  .file{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);
    background:var(--surface-3);border:1px solid var(--border);border-radius:var(--r-xs);padding:2px 9px;
  }
  .actions{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .btn{
    font-size:13px;font-weight:500;padding:8px 18px;border-radius:var(--r-sm);
    border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);cursor:pointer;
    transition:background .14s ease,color .14s ease,border-color .14s ease;
  }
  .btn:hover:not(:disabled){background:var(--surface-2);color:var(--text);border-color:#d2d2d9;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.primary{background:var(--text);color:#fff;border-color:var(--text);}
  .btn.primary:hover:not(:disabled){background:#2b2b33;}
  .hint{font-size:12px;color:var(--text-3);}
  .hide{display:none;}

  /* ============ 对照：商家填写 / 上传内容 ≠ 材料显示内容 ============ */
  .why-item{border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;margin-bottom:10px;}
  .why-item:last-child{margin-bottom:0;}
  .why-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px;}
  .tag{
    font-size:11px;font-weight:600;border-radius:var(--r-xs);padding:2px 8px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
  }
  .tag.high{background:var(--block-bg);border-color:var(--block-border);color:var(--block);}
  .tag.mid{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn);}
  .tag.low{background:var(--pass-bg);border-color:var(--pass-border);color:var(--pass);}
  .tag.na{background:var(--recheck-bg);border-color:var(--recheck-border);color:var(--recheck);}
  .tag.soft{background:transparent;border-style:dashed;color:var(--text-3);font-weight:500;}
  .cmp{display:grid;grid-template-columns:1fr 30px 1fr;align-items:stretch;gap:0;}
  .cmp-side{padding:10px 13px;border-radius:var(--r-sm);font-size:13px;line-height:1.7;}
  .cmp-side.left{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);}
  .cmp-side.right{background:var(--accent-bg);border:1px solid var(--accent-border);color:#3f478f;}
  .cmp-k{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;margin-bottom:5px;opacity:.75;}
  .cmp-mid{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-4);}
  .why-violation{
    margin-top:11px;font-size:13px;color:var(--text-2);line-height:1.75;
    border-top:1px dashed var(--border);padding-top:10px;
  }
  .why-violation b{color:var(--text);font-weight:600;}
  .pass-list{display:flex;flex-direction:column;gap:7px;}
  .pass-row{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--text-2);line-height:1.65;}
  .pass-row .ok{color:var(--pass);flex:none;font-size:11px;margin-top:2px;}
  details.fold{border-top:1px solid var(--border);margin-top:24px;padding-top:20px;margin-bottom:20px;}
  .card-pad > details.fold:last-child{margin-bottom:0;}
  details.fold > summary{
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;list-style:none;
    font-size:12px;font-weight:600;color:var(--text-3);
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 11px;
  }
  details.fold > summary::-webkit-details-marker{display:none;}
  details.fold > summary::before{content:"▸";font-size:9px;transition:transform .16s ease;}
  details.fold[open] > summary::before{transform:rotate(90deg);}
  details.fold > summary:hover{color:var(--text);border-color:var(--border-2);}
  .fold-body{margin-top:14px;}

  /* ============ 规则与申诉 ============ */
  .rule-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .rule{border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 14px;}
  .rule-t{font-size:13px;font-weight:600;margin-bottom:5px;}
  .rule-d{font-size:12px;color:var(--text-2);line-height:1.7;}
  .appeal{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;margin-top:16px;}
  .appeal-t{font-size:13px;font-weight:600;margin-bottom:8px;}
  .appeal-line{font-size:13px;color:var(--text-2);line-height:1.75;margin-bottom:5px;}
  .appeal-line:last-child{margin-bottom:0;}
  .appeal-line b{color:var(--text);font-weight:600;}
  .foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);line-height:1.85;}
  .foot b{color:var(--text-2);font-weight:600;}

  /* ============ 补充：说明块 / 键值内嵌 / 底栏按钮 ============ */
  .note{
    font-size:13px;color:var(--text-2);line-height:1.7;background:var(--surface-2);
    border-left:2px solid var(--border-2);border-radius:0 var(--r-xs) var(--r-xs) 0;padding:9px 13px;margin-top:12px;
  }
  .note b{color:var(--text);font-weight:600;}
  .ph-meta b{color:var(--text-2);font-weight:600;}
  .kv-v code{
    font-family:var(--mono);font-size:11px;color:var(--text-2);
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-xs);padding:1px 6px;
  }
  .kv-v .tag + .tag{margin-left:6px;}
  .rej-banner{background:var(--block-bg);border-color:var(--block-border);color:#a8382f;}
  .rej-banner.warn{background:var(--warn-bg);border-color:var(--warn-border);color:#8a5a09;}
  .rej-banner.review{background:var(--review-bg);border-color:var(--review-border);color:#4f3aab;}
  .rej-banner.recheck{background:var(--recheck-bg);border-color:var(--recheck-border);color:var(--recheck);}
  .btn.ghost{background:transparent;border-color:var(--border-2);}
  .btn.ghost:hover:not(:disabled){background:var(--surface-2);}

  @media (max-width:1180px){
    .cols{flex-direction:column;}
    .col-rail{width:100%;}
  }
  @media (max-width:900px){
    .side{display:none;}
    .crumb{display:none;}
    .brand-sub{display:none;}
  }
  @media (max-width:760px){
    .cmp{grid-template-columns:1fr;}
    .cmp-mid{padding:6px 0;}
    .stp-note{display:none;}
    .hdr-right .hdr-link{display:none;}
    .act-hint{display:none;}
    .act-actions .btn.ghost{display:none;}
  }
  /* ===== 商家上传材料：缩略图网格 + 点开看大图 ===== */
  .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;align-items:stretch;}
  .img-th{margin:0;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;
    background:var(--surface);cursor:zoom-in;
    transition:box-shadow .16s ease,transform .16s ease,border-color .16s ease;}
  .img-th:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(15,23,42,.14);border-color:#cfd4de;}
  .img-th:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  /* 材料图有长有短（报告是竖版、主图是方图），统一装进同一个比例的框里居中缩放，
     缩略图阵列才是齐的。说明文字不进阵列——只在放大层里出现 */
  .it-frame{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
    padding:11px;background:var(--surface-2);border-bottom:1px solid var(--border);}
  .it-frame svg,.lb-img svg{display:block;
    font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,-apple-system,sans-serif;}
  .it-frame svg{width:auto;height:auto;max-width:100%;max-height:100%;
    border-radius:4px;box-shadow:0 2px 8px rgba(15,23,42,.13);}
  /* 材料徽标单独占一行：不压图——图本身就是证据，任何一个角都不该被标签盖住 */
  .it-top{display:flex;align-items:center;gap:6px;padding:7px 9px;
    border-bottom:1px solid var(--border);background:var(--surface);}
  .it-loc{font-size:11px;font-weight:700;color:var(--text);}
  .it-chg{font-size:11px;font-weight:600;white-space:nowrap;color:var(--pass);
    background:var(--pass-bg);border:1px solid var(--pass-border);border-radius:999px;padding:2px 7px;}
  .it-type{margin-left:auto;font-size:11px;font-weight:600;white-space:nowrap;color:var(--accent);
    background:var(--accent-bg);border:1px solid rgba(76,88,214,.18);border-radius:999px;padding:2px 7px;}
  .it-noart{padding:0 12px;text-align:center;font-size:12px;color:var(--text-4);}
  .imgs-na{font-size:12px;color:var(--text-4);background:var(--surface-2);border:1px dashed var(--border-2);
    border-radius:var(--r-sm);padding:14px 16px;line-height:1.7;}

  /* 提交反馈 toast：与审核端同一套反馈语言（顶栏下方居中、深色）。
     这里多一行括号引导，所以用圆角气泡而不是 999px 胶囊 —— 胶囊装两行会变形。 */
  .toast{
    position:fixed;left:50%;top:70px;z-index:70;transform:translateX(-50%) translateY(-12px);
    background:var(--text);color:#fff;font-size:12.5px;font-weight:600;line-height:1.5;
    padding:11px 18px;border-radius:14px;text-align:left;
    box-shadow:0 10px 28px rgba(20,22,28,.3);opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;
    /* width:max-content 必须留着：left:50% 的定位元素默认按「到右边缘的剩余宽度」收缩，
       手机上只剩 195px，文案会被折成四行。先按内容撑开，再用 max-width 兜住。 */
    width:max-content;max-width:min(560px,92vw);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast-sub{display:block;font-size:11.5px;font-weight:500;opacity:.85;margin-top:3px;}

  /* 放大浮层 */
  .lb{position:fixed;inset:0;z-index:300;display:none;background:rgba(10,14,24,.74);padding:30px 24px;}
  .lb.show{display:flex;align-items:center;justify-content:center;}
  .lb-box{background:var(--surface);border-radius:14px;overflow:hidden;width:100%;
    max-width:min(940px,95vw);max-height:93vh;display:flex;flex-direction:column;
    box-shadow:0 30px 74px rgba(0,0,0,.46);}
  .lb-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
  .lb-title{font-size:13px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;letter-spacing:-.01em;}
  .lb-case{font-size:11px;color:var(--text-4);}
  .lb-close{margin-left:auto;flex:none;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;
    background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:6px 12px;}
  .lb-close:hover{background:#e9ebf1;color:var(--text);}
  .lb-body{display:grid;grid-template-columns:minmax(0,1fr) 296px;min-height:0;flex:1;}
  .lb-img{background:var(--surface-2);display:flex;align-items:center;justify-content:center;
    padding:20px;overflow:auto;}
  .lb-img svg{width:auto;height:auto;max-width:100%;max-height:62vh;
    border-radius:7px;box-shadow:0 10px 30px rgba(15,23,42,.2);}
  .lb-side{padding:15px 16px;border-left:1px solid var(--border);overflow:auto;}
  .lb-k{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text-4);margin-bottom:7px;}
  .lb-d{font-size:12px;line-height:1.85;color:var(--text-2);}
  .lb-nav{display:flex;align-items:center;gap:9px;padding:10px 16px;border-top:1px solid var(--border);}
  .lb-btn{font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;
    background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:5px 12px;}
  .lb-btn:hover:not(:disabled){background:#e9ebf1;color:var(--text);}
  .lb-btn:disabled{opacity:.42;cursor:not-allowed;}
  .lb-idx{font-size:12px;color:var(--text-3);min-width:54px;text-align:center;}
  .lb-hint{margin-left:auto;font-size:11px;color:var(--text-4);}
  @media (max-width:820px){
    .lb-body{grid-template-columns:1fr;}
    .lb-side{border-left:none;border-top:1px solid var(--border);}
    .lb-img svg{max-height:46vh;}
    .lb-hint{display:none;}
  }
  /* 商家侧「你提交的商品信息」卡：回放当时提交的图文 */
  .orig-title{font-size:16px;font-weight:600;line-height:1.5;color:var(--text);margin-bottom:14px;}
  .orig-h{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text-4);margin-bottom:7px;}
  .orig-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .imgs.mini{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}

  /* ============ 手机端（≤900px）：步骤条改纵向 ============
     原横向摆法在窄屏放不下，.steps 的 overflow:hidden 会把第 4、5 步整块裁掉
     （390px 实测：内容 599px / 可见 344px，只看得见前 3 步）；
     ≤760px 又用 .stp-note{display:none} 把每步说明藏了。
     改纵向后一步一行、5 步全可见，并把说明恢复出来。
     规则写在 ≤900px 内，桌面端不受影响。 */
  @media (max-width:900px){
    .steps{display:block;overflow:visible;padding:12px 16px;}
    .stp{width:100%;padding:7px 0;align-items:flex-start;}
    .stp-line{display:none;}
    .stp-note{display:block;}
    .stp-dot{margin-top:1px;}
  }
</style>
</head>

  return {fix:fix, supply:supply, total: fix.length + supply.length};
}

/* ================= 问题 → 操作 的对应（把整改/补证挂到具体问题下） ================= */
/* 金标没有 hit 与整改部件/补证项之间的显式关联字段，这里按语义手工归位：
     f = 整改部件下标（rectification_parts_list 按「；」拆分后的顺序）
     s = 补证项下标（evidence_requests 顺序）
   一条操作只挂到最贴切的那条问题下；未被引用的操作落到卡片底部的「其他需要处理」。 */
const HIT_ACTIONS = {
  C31:      [{f:[1],s:[]},    {f:[0],s:[]},   {f:[2],s:[0]}, {f:[],s:[]},   {f:[3],s:[1]}],
  C35:      [{f:[0],s:[3]},   {f:[],s:[1]},   {f:[2],s:[0]}, {f:[1],s:[]}],
  NORMAL:   [{f:[0,1],s:[]},  {f:[],s:[]},    {f:[2],s:[]},  {f:[3],s:[]}],
  DOWNGRADE:[{f:[0,1],s:[]},  {f:[],s:[]},    {f:[2],s:[]},  {f:[3],s:[]}]
};

/* ================= 状态条推导 ================= */
function deriveSteps(c){
  const cons = c.output.conclusion;
  const td = buildTodos(c);
  const degraded = c.mode === 'degraded';
  const steps = [{idx:'1', name:'提交资料', st:'done', note:'商品信息与图片已提交', ts:DEMO_TS.submit}];

  if (cons === 'RECHECK'){
    steps.push({idx:'2', name:'系统校验', st:'hold', note:'服务超时，重试中'});
    steps.push({idx:'3', name:'处理问题', st:'hold', note:'系统故障，无需操作'});
    steps.push({idx:'4', name:'机器审核', st:'', note:'待重试结果'});
    steps.push({idx:'5', name:'复判结果', st:'', note:'等待重试结果'});
    return steps;
  }
  steps.push({idx:'2', name:'系统校验', st:'done',
    note: degraded ? '已由机器审核通道完成' : '已完成一致性校验', ts:DEMO_TS.machine});
  if (cons === 'PASS'){
    steps.push({idx:'3', name:'处理问题', st:'done', note:'无需处理'});
    steps.push({idx:'4', name:'机器审核', st:'done', note:'无需审核介入'});
    steps.push({idx:'5', name:'复判结果', st:'done', note:'已放行'});
  } else if (td.total > 0){
    if (state.submitted){
      /* 已提交：步骤条必须跟着走。否则页面一边说「已提交」，一边还停在「待处理 N 项」 */
      steps.push({idx:'3', name:'处理问题', st:'done', note:'整改与补证已提交'});
      steps.push({idx:'4', name:'机器审核', st:'now', note:'复判中'});
      steps.push({idx:'5', name:'复判结果', st:'', note:'等待复判结果'});
    } else {
      steps.push({idx:'3', name:'处理问题', st:'now', note:'待处理 '+td.total+' 项', ts:DEMO_TS.manual});
      steps.push({idx:'4', name:'机器审核', st:'', note:'待机器审核'});
      steps.push({idx:'5', name:'复判结果', st:'', note:'等待复判'});
    }
  } else {
    steps.push({idx:'3', name:'处理问题', st:'done', note:'无需处理'});
    steps.push({idx:'4', name:'机器审核', st:'', note:'等待机器审核'});
    steps.push({idx:'5', name:'复判结果', st:'', note:'等待复判'});
  }
  return steps;
}

/* ================= 渲染 ================= */
const state = { id:'C31', checked:{}, edits:{}, sent:{}, matText:{}, files:[], submitted:false, shopOpen:false, pendingKey:'' };

function currentCase(){ return normalize(CASES[state.id]); }

function resetState(id){
  state.id = id; state.checked = {}; state.edits = {}; state.sent = {}; state.matText = {}; state.files = []; state.submitted = false; state.shopOpen = false; state.pendingKey = '';

  /* 换了商品就收起上一条的提交提示，否则新商品头上还挂着上一条的「已提交」 */
  hideToast();
}

/* 横向步骤条 */
function renderSteps(c){
  const steps = deriveSteps(c);
  document.getElementById('steps').innerHTML = steps.map(function(s,i){
    const cls = s.st === 'done' ? 'done' : (s.st === 'hold' ? 'hold' : (s.st === 'now' ? 'now' : 'wait'));
    const mark = s.st === 'done' ? '✓' : s.idx;
    const sub = s.ts ? '<span class="ts">'+esc(shortTs(s.ts))+'</span>' : esc(s.note);

      + '<span class="stp-dot">'+esc(mark)+'</span>'
      + '<span class="stp-txt"><span class="stp-name">'+esc(s.name)+'</span>'
      +   '<span class="stp-note">'+sub+'</span></span></div>';
    return i < steps.length - 1 ? seg + '<span class="stp-line"></span>' : seg;
  }).join('');
}

/* 你提交的商品信息卡：回放商家当时提交的图文，供对照下方判定结果 */
function renderOriginal(c){
  const inp = c.input || {};
  const rows = [];

  /* 1. 商品标题 + 类目 */
  if (inp.title){
    rows.push('<div class="orig-title">' + esc(inp.title)
      + (inp.category ? '<span class="tag soft" style="margin-left:8px">' + esc(inp.category) + '</span>' : '')
      + '</div>');
  }

  /* 2. 宣传主张（缺失不虚构） */
  const claims = Array.isArray(inp.merchantClaims) ? inp.merchantClaims : [];
  if (claims.length){
    rows.push('<div class="orig-h">宣传主张</div>'
      + '<div class="orig-chips">'
      + claims.map(function(x){ return '<span class="tag">' + esc(x) + '</span>'; }).join('')
      + '</div>');
  }

  /* 3. 商品参数（过滤掉「店铺」——顶栏已显示，不重复） */
  const attrs = (Array.isArray(inp.skuAttributes) ? inp.skuAttributes : [])
    .filter(function(a){ return a && a.k !== '店铺'; });
  if (attrs.length){
    rows.push('<details class="fold"><summary>商品参数（' + attrs.length + ' 项）</summary>'
      + '<div class="fold-body">'
      + attrs.map(function(a){ return kvRow(a.k, esc(a.v)); }).join('')
      + '</div></details>');
  }

  /* 4. 图片材料：缩略图网格；说明文字不进网格，点开放大后在右侧看 */
  const list = imgsOf(c);
  if (list.length){
    rows.push('<div class="imgs mini" id="origImgs">'
      + list.map(function(im, i){
          const art = imgArt(c.id, im);
          const loc = im.locator || ('图' + (i + 1));
          return '<figure class="img-th" data-i="' + i + '" tabindex="0" role="button"'
            + ' aria-label="放大查看 ' + esc(loc) + '：' + esc(imgTypeZh(im)) + '">'
            + '<div class="it-top"><span class="it-loc">' + esc(loc) + '</span>'
            + (state.matText[c.id + '::' + loc] ? '<span class="it-chg">已修改</span>' : '')
            + '<span class="it-type">' + esc(imgTypeZh(im)) + '</span></div>'
            + '<div class="it-frame">'
            + (art || '<div class="it-noart">本条暂无预览图</div>')
            + '</div></figure>';
        }).join('')
      + '</div>');
  } else {
    rows.push('<div class="imgs-na">本条未上传图片材料</div>');
  }

  return '<div class="card"><div class="card-pad">'

    +     esc(shortTs(DEMO_TS.submit)) + ' · 原型示意</span></div>'
    + '<div class="sec-sub">以下为你提交时填写与上传的内容，用于对照下方判定结果</div>'
    + rows.join('')
    + '</div></div>';

/* 缩略图点击放大：照搬 renderImgs 的绑定方式（重渲染后重新绑定） */
function bindOrigImgs(){
  const box = document.getElementById('origImgs');
  if (!box) return;
  Array.prototype.forEach.call(box.querySelectorAll('.img-th'), function(el){
    const open = function(){ openLightbox(parseInt(el.getAttribute('data-i'), 10)); };
    el.addEventListener('click', open);
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  });
}

/* 单条「需要修改的内容」：文字改动就地输入 → 提交后同步刷新材料图；要补文件的才弹文件选择器。
   判据是「动作」不是「位置」：图上的一句话也是文字改动，改文字就行，不必让人重新传一张图。 */
function todoFixHtml(it, i){
  const key = 'fix'+i, on = !!state.checked[key];
  const txt = String(it.text || '');
  /* 整改要求里 「」 内的一般就是要改掉的原表述，预填进输入框供商家直接改 */
  const orig = (txt.match(/「([^」]+)」/) || [])[1] || '';
  const val = state.edits[key] !== undefined ? state.edits[key] : orig;
  /* 要证明 / 报告 / 证书的，才需要选文件；「删掉 / 改为 / 移除」这类只改文字 */
  const needFile = /补证|补齐|证明|证书|报告|主体关系|资质/.test(txt);
  const needText = !needFile || /改|删|修正|移除|标注|限定|核实|对齐|表述/.test(txt);
  const mine = state.files.filter(function(f){ return f.key === key; });

  let act = '';
  if (needText){
    act += '<input class="fix-input" type="text" data-key="'+key+'" data-orig="'+esc(orig)+'"'
      +   ' value="'+esc(val)+'" placeholder="填写修改后的内容" aria-label="修改后的内容">'
      + '<div class="sup-up">'
      +   '<button class="btn tiny" type="button" data-act="fixsubmit" data-key="'+key+'">提交修改</button>'
      +   '<span class="fix-hint">'+(orig ? '原文：'+esc(orig)+'　提交后自动更新' : '填写后点提交')+'</span>'
      + '</div>';
  }
  if (needFile){
    act += '<div class="sup-up">'
      +   '<button class="btn tiny" type="button" data-act="up" data-key="'+key+'">上传材料</button>'
      +   mine.map(function(f){ return '<span class="file">📎 '+esc(f.name)+'</span>'; }).join('')
      + '</div>'
      + '<div class="fix-hint">需要补交新的材料文件，请选择后上传。</div>';
  }
  if (state.sent[key]) act += '<div class="fix-hint">已提交：'+esc(state.sent[key])+'</div>';

  return '<div class="todo'+(on?' done':'')+'" data-key="'+key+'">'
    + '<div class="todo-box">✓</div>'
    + '<div class="todo-main"><div class="todo-title">'
    +   (it.loc ? '<span class="loc">'+esc(it.loc)+'</span>' : '')
    +   '<span>'+esc(it.text)+'</span>'
    + '</div>'
    + act
    + '</div></div>';
}
/* 单条「需要补充的材料」：就地给一个上传入口，不必再滚到页面底部 */
function todoSupplyHtml(it, i){
  const key = 'sup'+i, on = !!state.checked[key];
  const mine = state.files.filter(function(f){ return f.key === key; });
  return '<div class="todo'+(on?' done':'')+'" data-key="'+key+'">'
    + '<div class="todo-box">✓</div>'
    + '<div class="todo-main">'
    +   '<div class="todo-title">'+esc(it.claim || '—')+'</div>'
    +   '<div class="todo-body">需要补充：'+esc(it.request || '—')+'</div>'
    +   (it.deadline ? '<div class="todo-meta"><b>截止条件：</b>'+esc(it.deadline)+'</div>' : '')
    +   '<div class="sup-up">'
    +     '<button class="btn tiny" type="button" data-act="up" data-key="'+key+'">上传材料</button>'
    +     mine.map(function(f){ return '<span class="file">📎 '+esc(f.name)+'</span>'; }).join('')
    +   '</div>'
    + '</div></div>';
}
/* 某条问题对应的操作区：没有专属操作时，提示与其它问题同源 */
function hitActHtml(td, act, usedFix, usedSup){
  if (!td.total) return '';
  const fIdx = (act && act.f) || [], sIdx = (act && act.s) || [];
  if (!fIdx.length && !sIdx.length){
    return '<div class="hit-act"><div class="hit-note">'
      + '本条与上面其它问题同源，按对应问题给出的修改方式一并处理即可。</div></div>';
  }
  fIdx.forEach(function(i){ usedFix[i] = true; });
  sIdx.forEach(function(i){ usedSup[i] = true; });
  let h = '<div class="hit-act">';
  if (fIdx.length){
    h += '<div class="ha-h">需要修改的内容</div>'
      + fIdx.map(function(i){ return todoFixHtml(td.fix[i], i); }).join('');
  }
  if (sIdx.length){
    h += '<div class="ha-h">需要补充的材料</div>'
      + sIdx.map(function(i){ return todoSupplyHtml(td.supply[i], i); }).join('');
  }
  return h + '</div>';
}

/* 驳回原因卡：每条命中用规范、可执行的抬头 + 商家填写 / 材料显示 / 差异说明 三行 */
function renderReject(c){
  const o = c.output, m = M_STATUS[o.conclusion] || M_STATUS.RECHECK, td = buildTodos(c);

  if (o.conclusion === 'PASS'){
    return '<div class="card"><div class="card-pad">'
      + '<div class="rej-head"><span class="sec-title">审核通过</span>'
      +   '<span class="mode-tag" style="margin-left:auto">无需处理</span></div>'
      + '<div class="sec-sub">'+esc(m.d)+'</div>'
      + '<div class="note">你填写的信息、上传的图片与平台规则一致，本条无需处理。</div>'
      + '</div></div>';
  }

  const isRecheck = o.conclusion === 'RECHECK';
  const bannerTxt = isRecheck
    ? '系统查询服务暂时未返回结果，平台正在自动重试。你无需进行任何操作，也不会因系统故障受到处罚。'
    : ('本条信息共 ' + o.hits.length + ' 项需要修改。请按下列各项完成修改并补齐材料后，重新提交复核。');

  const hitMap = HIT_ACTIONS[state.id] || [];
  const usedFix = {}, usedSup = {};

  const items = o.hits.map(function(h,i){
    /* 系统故障类命中不是商家材料的问题，单独说明，避免商家误以为是自己材料有误 */
    const toolErr = /TOOL_ERROR/.test(h.reason_code || '') || h.severity === '未决';
    const title = toolErr ? '本条暂无法核实（非材料问题）'
                          : (HIT_TITLE[h.dimension] || '信息不一致');
    const body = toolErr
      ? '<div class="note" style="margin-top:8px">系统核验证书时查询服务超时，与你的材料无关。'
        + '平台将自动重试：重试成功后继续正常审核；若持续失败，将转人工线下核验，期间不会对本商品做任何处罚。</div>'
      : kvRow('商家填写', '<span class="quo">'+esc(h.claim||'—')+'</span>')
        + kvRow('材料显示', esc(h.evidence||'—'))
        + kvRow('差异说明', esc(h.violation||'—'));
    return '<div class="rej-item">'
      + '<div class="ri-head"><span class="ri-n">'+String(i+1).padStart(2,'0')+'</span>'
      +   '<span class="ri-t">'+esc(title)+'</span>'
      +   '<span class="tag '+sevClass(h.severity)+'">'+esc(SEV_PLAIN[h.severity] || h.severity || '—')+'</span></div>'
      + body
      + (toolErr ? '' : hitActHtml(td, hitMap[i], usedFix, usedSup))
      + '</div>';
  }).join('');

  /* 没挂到具体问题上的操作集中列在底部；同样是可勾选的待办，避免遗漏导致无法提交 */
  let restRows = '', restN = 0;
  td.fix.forEach(function(it,i){ if (!usedFix[i]){ restRows += todoFixHtml(it, i); restN++; } });
  td.supply.forEach(function(it,i){ if (!usedSup[i]){ restRows += todoSupplyHtml(it, i); restN++; } });
  const restHtml = restN
    ? '<div class="todo-group" style="margin-top:16px"><div class="tg-head">'
      + '<span class="tg-name">其他需要处理</span><span class="tg-count">'+restN+' 项</span></div>'
      + restRows + '</div>'
    : '';

  return '<div class="card"><div class="card-pad">'
    + '<div class="rej-head"><span class="sec-title">'+(isRecheck?'系统核对中':'驳回原因')+'</span>'
    +   (o.hits.length ? '<span class="rej-badge">'+o.hits.length+'</span>' : '')
    +   (c.mode==='degraded'
    ?   '<span class="mode-tag degraded" style="margin-left:auto">本次已转机器审核</span>' : '')
    +   '</div>'
    + '<div class="rej-banner '+m.tone+'">'+esc(bannerTxt)+'</div>'
    + items + restHtml
    + '</div></div>';
}

function renderProgress(){
  const c = currentCase(), td = buildTodos(c);
  const total = td.total;
  let done = 0;
  for (let i=0;i<td.fix.length;i++) if (state.checked['fix'+i]) done++;
  for (let i=0;i<td.supply.length;i++) if (state.checked['sup'+i]) done++;
  const pct = total ? Math.round(done/total*100) : 100;

  /* 底部操作栏左侧：进度条 + 计数 + 提示 */
  const lead = document.getElementById('actLead');
  if (total){
    let hint;
    if (state.submitted) hint = '已提交，等待平台复判。';
    else if (done < total) hint = '还有 ' + (total-done) + ' 项未处理，改完/传完即可提交。';
    else if (!state.files.length) hint = '已全部处理完，可直接提交（建议一并上传补充材料）。';
    else hint = '已全部处理完，可提交。';
    lead.innerHTML =
        '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>'
      + '<span class="act-count" id="actCount">待处理 <b>'+total+'</b> 项 · 已处理 <b>'+done+'/'+total+'</b></span>'
      + '<span class="act-hint" id="actHint">'+esc(hint)+'</span>';
  } else {
    lead.innerHTML = '<span class="act-count">'+esc(c.output.conclusion==='PASS' ? '本条已通过，无需提交' : '本条无需处理')+'</span>';
  }

  /* 右栏进度卡 */
  const railFill = document.getElementById('railFill');
  if (railFill){
    railFill.style.width = pct + '%';
    document.getElementById('railDone').innerHTML = done + '<small>/'+total+'</small>';
    document.getElementById('railNote').textContent =
      state.submitted ? '已提交，等待复判'
      : (done === 0 ? '尚未开始处理' : (done >= total ? '已全部处理，可提交' : '已处理 ' + done + ' 项'));
  }

  const btn = document.getElementById('submitBtn');

/* 为什么这样判定：逐条对照 */
function renderWhy(c){
  const o = c.output;
  const dim = function(d){ return DIM_LABEL[d] || d || '—'; };

  const body = o.hits.length
    ? o.hits.map(function(h){
        /* 与「驳回原因」口径一致：系统故障类命中不是商家材料的问题，不套用材料类问题名 */
        const toolErr = /TOOL_ERROR/.test(h.reason_code || '') || h.severity === '未决';
        const typeTxt = toolErr ? '本条暂无法核实（非材料问题）'
                                : (HIT_TITLE[h.dimension] || '信息不一致');
        return '<div class="why-item">'
          + '<div class="why-head">'
          +   '<span class="tag">'+esc(h.content_layer || '—')+'</span>'
          +   '<span class="tag soft">'+esc(typeTxt)+'</span>'
          +   '<span class="tag '+sevClass(h.severity)+'">影响程度 '+esc(SEV_PLAIN[h.severity] || h.severity || '—')+'</span>'
          + '</div>'
          + '<div class="cmp">'
          +   '<div class="cmp-side left"><span class="cmp-k">商家填写 / 上传内容</span>'+esc(h.claim || '—')+'</div>'
          +   '<div class="cmp-mid">≠</div>'
          +   '<div class="cmp-side right"><span class="cmp-k">材料显示内容</span>'+esc(h.evidence || '—')+'</div>'
          + '</div>'
          + '<div class="why-violation"><b>差异说明：</b>'+esc(h.violation || '—')+'</div>'
          + '</div>';
      }).join('')
    : '<div class="empty">本条未发现不一致项。</div>';

  const pass = o.passChecks.length
    ? o.passChecks.map(function(p){
        return '<div class="pass-row"><span class="ok">✓</span><span><b>'+esc(dim(p.dimension))+'</b>：'+esc(p.note || '')+'</span></div>';
      }).join('')
    : '<div class="hint">无</div>';

  return '<div class="card"><div class="card-pad">'
    + '<div class="sec-head"><span class="sec-num">01</span><span class="sec-title">为什么这样判定</span></div>'
    + '<div class="sec-sub">每条判定均对应「商家填写 / 上传的内容」与「材料显示的内容」，可逐条查看并据此申诉</div>'
    + body
    + '<details class="fold"><summary>查看已确认无问题的项</summary>'
    + '<div class="fold-body"><div class="pass-list">'+pass+'</div></div></details>'
    + '</div></div>';
}

/* 审核依据与申诉 */
function renderRules(c){
  const a = c.output.appeal;
  const appeal = (!a.recoup && !a.suggestion)
    ? '<div class="appeal"><div class="appeal-t">申诉</div><div class="appeal-line">本条无需申诉。</div></div>'
    : '<div class="appeal" id="appealBox">'
      + '<div class="appeal-t">申诉与复核</div>'
      + (a.recoup ? '<div class="appeal-line"><b>可否翻案：</b>'+esc(a.recoup)+'</div>' : '')
      + (a.suggestion ? '<div class="appeal-line"><b>平台建议：</b>'+esc(a.suggestion)+'</div>' : '')
      + '<div class="appeal-line hint">若已补齐材料或认为判定有误，可提交补证后申请复核。</div>'
      + '</div>';

    + '<div class="rule-list">'

    +   '<div class="rule"><div class="rule-t">功效与条件</div><div class="rule-d">检测报告含作用时间、菌种、样本量等限定条件；宣传时不得省略限定条件，也不得将实验室条件下的结果表述为日常使用效果。</div></div>'
    +   '<div class="rule"><div class="rule-t">资质有效性</div><div class="rule-d">证书、报告需可核验、在有效期内，并与售卖主体（店铺 / 品牌）相对应。</div></div>'
    + '</div>'

/* 右栏：处理进度 + 审核时间线 */
function renderRail(c){
  const td = buildTodos(c), m = M_STATUS[c.output.conclusion] || M_STATUS.RECHECK;
  let rail0 = '', rail1;

  if (td.total > 0){
    rail0 = '<div class="card"><div class="card-pad">'
      + '<div class="sec-head"><span class="sec-title" style="font-size:13px">剩余补证时间</span></div>'
      + '<div class="cd-num" style="margin-top:12px">'+esc(DEMO_CD.d)+'<em>天</em>'+esc(DEMO_CD.h)+'<em>小时</em></div>'
      + '<div class="cd-bar"><div class="cd-fill" style="width:'+DEMO_CD.pct+'%"></div></div>'
      + '<div class="cd-hint">倒计时用于提醒补证时限；超时后的处理口径以平台正式规则为准。</div>'
      + '<div class="cd-demo">原型示意 · 演示值，本页未接入真实截止时间与计时逻辑</div>'
      + '</div></div>';
  }

  if (td.total > 0){
    rail1 = '<div class="card"><div class="card-pad">'
      + '<div class="sec-head"><span class="sec-title" style="font-size:13px">处理进度</span></div>'
      + '<div class="sec-sub" style="margin-bottom:12px">按各条问题给出的方式完成修改或补交材料后实时更新</div>'
      + '<div class="rail-prog"><span class="rp-num" id="railDone">0<small>/'+td.total+'</small></span>'
      +   '<span class="rp-note" id="railNote">尚未开始处理</span></div>'
      + '<div class="prog-bar"><div class="prog-fill" id="railFill" style="width:0%"></div></div>'
      + '</div></div>';
  } else {
    const txt = c.output.conclusion === 'PASS'
      ? '本条已通过一致性校验，无需整改与补证。'
      : (c.output.conclusion === 'RECHECK'
        ? '平台正在重新取数，你无需操作。'
        : '本条无需处理的条目，等待平台复核。');
    rail1 = '<div class="card"><div class="card-pad">'
      + '<div class="sec-head"><span class="sec-title" style="font-size:13px">处理进度</span></div>'
      + '<div class="rail-empty">'+esc(txt)+'</div></div></div>';
  }

  const tl = deriveSteps(c).map(function(s){
    const cls = s.st === 'done' ? 'done' : (s.st === 'hold' ? 'hold' : (s.st === 'now' ? 'now' : ''));
    return '<div class="tl-item"><span class="tl-dot '+cls+'"></span>'
      + '<div class="tl-t">'+esc(s.name)+'</div>'
      + '<div class="tl-d">'+esc(s.note)+(s.ts ? '<br><span class="ts">'+esc(s.ts)+'</span>' : '')+'</div></div>';
  }).join('');

  const rail2 = '<div class="card"><div class="card-pad">'
    + '<div class="sec-head"><span class="sec-title" style="font-size:13px">审核时间线</span>'
    +   '<span class="mode-tag" style="margin-left:auto">'+esc(m.t)+'</span></div>'
    + '<div class="sec-sub" style="margin-bottom:12px">按流程节点展示；时间为原型示意值</div>'
    + '<div class="tl">'+tl+'</div>'
    + '</div></div>';

  document.getElementById('colRail').innerHTML = rail0 + rail1 + rail2;
}

      + '<button class="btn ghost" data-act="appeal">我要申诉</button>'

/* ================= 提交反馈 toast ================= */
/* 主句给结果，第二行给「还能玩什么」。右上角那个入口在顶栏，toast 也在顶部，
   提示与被提示的东西落在同一视线区域，访客不用回头找。 */
let toastTimer;
function showToast(main, sub){
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerHTML = esc(main) + (sub ? '<span class="toast-sub">'+esc(sub)+'</span>' : '');
  el.hidden = false;
  requestAnimationFrame(function(){ el.classList.add('show'); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 4200);
}
function hideToast(){
  const el = document.getElementById('toast');
  if (!el) return;
  clearTimeout(toastTimer);
  el.classList.remove('show');
}

/* ===== 可复用矢量材料图模板 =====
   金标只给文字描述，这里按材料类型套版式、把描述文字排进去，生成「一眼能认出这是份什么材料」的示意图。
   实拍主图不硬画实物，只做中性占位。带手绘专用图（MATERIAL_ART）的优先用专用图，其余按类型兜底套模板。 */
function matSegs(text){
  return String(text || '').split(/[；;\n]/).map(function(s){ return s.trim(); }).filter(Boolean);
}
function matPick(text, keys){
  for (let i = 0; i < keys.length; i++){
    const m = String(text || '').match(new RegExp(keys[i] + '[：:＝=]?\\s*([^；;。]+)'));
    if (m && m[1]) return m[1].trim();
  }
  return '';
}
/* 按每行 per 字硬折行，最多 max 行（中文等宽，够用） */
function matLines(text, per, max){
  const s = String(text || '').trim(), out = [];
  for (let i = 0; i < s.length && out.length < max; i += per) out.push(s.slice(i, i + per));
  if (s.length > per * max && out.length){
    out[out.length - 1] = out[out.length - 1].slice(0, Math.max(1, per - 1)) + '…';
  }
  return out;
}
function matTxt(lines, x, y, lh, size, fill, weight, anchor){
  return lines.map(function(t, i){
    return '<text x="' + x + '" y="' + (y + i * lh) + '" font-size="' + size + '"'
      + (weight ? ' font-weight="' + weight + '"' : '')
      + (anchor ? ' text-anchor="' + anchor + '"' : '')
      + ' fill="' + fill + '">' + esc(t) + '</text>';
  }).join('');
}
function matSvg(label, inner){
  return '<svg viewBox="0 0 400 300" width="520" height="390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + esc(label) + '（示意）">'
    + inner + '</svg>';
}
/* ===== 共用质感件 =====
   同一页会同时渲染多张材料图，defs 的 id 必须逐个唯一，否则后面的图会串用前一张的渐变 / 滤镜。
   纸张颗粒用来消掉纯矢量的塑料感——极低透明度，只当质感，不挡内容。 */
let matUidN = 0;
function matUid(){ matUidN++; return 'mz' + matUidN; }
function matGrainDef(u, freq){
  return '<filter id="' + u + '" x="0" y="0" width="100%" height="100%">'
    + '<feTurbulence type="fractalNoise" baseFrequency="' + freq + '" numOctaves="3" stitchTiles="stitch"/>'
    + '<feColorMatrix type="saturate" values="0"/></filter>';
}
function matGrainRect(u, op){
  return '<rect width="400" height="300" filter="url(#' + u + ')" opacity="' + op + '"/>';
}

  const segs = matSegs(d);
  let head = qs.length ? qs[0] : (matPick(d, ['大字', '主标']) || segs[0] || '宣传主张');
  head = String(head).replace(/^(大字|主标|主图|副标|醒目|小字)[：:]?/, '').replace(/[「」『』"]/g, '').trim();

      s += '<text x="' + (x + pw * 0.24 + j * 9) + '" y="' + (ry + h * 0.112) + '" font-size="8" fill="#e0a13a">★</text>';
    }
    s += '<line x1="' + (x + pw * 0.24) + '" y1="' + (ry + h * 0.140) + '" x2="' + (x + pw * 0.82) + '" y2="' + (ry + h * 0.140) + '" stroke="#dfe5ee"/>';
  }
  return s;
}
/* 纯色短袖 T 恤（多色挂拍用，不依赖渐变） */
function pdTeeC(cx, by, w, h, fill, stroke, hang){
  const ty = by - h, sh = w * 0.34, hem = w * 0.30;
  let s = hang ? pdHanger(cx, ty, sh * 0.9) : '';
  s += '<path d="M' + (cx - sh) + ' ' + (ty + h * 0.12) + ' L' + (cx - sh - w * 0.16) + ' ' + (ty + h * 0.44) + ' L' + (cx - sh * 0.64) + ' ' + (ty + h * 0.56) + ' L' + (cx - sh * 0.44) + ' ' + (ty + h * 0.26) + ' Z" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
  s += '<path d="M' + (cx + sh) + ' ' + (ty + h * 0.12) + ' L' + (cx + sh + w * 0.16) + ' ' + (ty + h * 0.44) + ' L' + (cx + sh * 0.64) + ' ' + (ty + h * 0.56) + ' L' + (cx + sh * 0.44) + ' ' + (ty + h * 0.26) + ' Z" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
  s += '<path d="M' + (cx - sh) + ' ' + (ty + h * 0.10) + ' Q' + cx + ' ' + (ty - h * 0.02) + ' ' + (cx + sh) + ' ' + (ty + h * 0.10) + ' L' + (cx + hem) + ' ' + by + ' L' + (cx - hem) + ' ' + by + ' Z" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
  s += '<ellipse cx="' + cx + '" cy="' + (ty + h * 0.10) + '" rx="' + (sh * 0.52) + '" ry="' + (h * 0.07) + '" fill="none" stroke="' + stroke + '" stroke-width="2.2"/>';
  return s;
}

const MAT_TPL = {report:matArtReport, cert:matArtCert, promo:matArtPromo, spec:matArtSpec, tag:matArtTag, pack:matArtPack, photo:matArtPhoto};
/* 选版式：先认 type，再按描述里的材料形态兜底
   （吊牌/报关单/成分表这些常挂在 detail_image 下，不看描述认不出来） */
function matKind(im){
  const t = (im && im.type) || '', d = (im && im.description) || '';
  if (t === 'report') return 'report';
  if (t === 'certificate') return 'cert';
  if (t === 'promo_image') return 'promo';
  if (/吊牌|洗唛|水洗标|领标|织标/.test(d)) return 'tag';
  if (/包装|袋装|瓶身|外箱/.test(d)) return 'pack';
  if (/报关单|授权书|资质证书|专利证书|证书/.test(d)) return 'cert';
  if (/检测报告|检验报告/.test(d)) return 'report';
  /* 带叠加文案的主图（价格/条件类断裂就出在这类图上）：先于「主图→占位」判，否则文案会被吃掉 */
  if (/醒目|大字|小字|叠加文案|文案|标注|到手价|专享价/.test(d)) return 'promo';
  if (/成分表|配料表|营养|参数|规格|明细|表格|标签|标识|铭牌|成分/.test(d)) return 'spec';
  if (t === 'main_image' || t === 'product_image' || t === 'detail_image') return 'photo';
  if (/实拍|商品图|买家|聊天|截图|模糊|OCR/.test(d)) return 'photo';
  if (/宣传|海报|主视觉/.test(d)) return 'promo';
  return 'spec';
}
function matArt(im){
  const f = MAT_TPL[matKind(im)];
  return f ? f(im || {}) : null;
}
function matApplyEdits(text, ed){
  let out = String(text == null ? '' : text);
  Object.keys(ed).forEach(function(from){ out = out.split(from).join(ed[from]); });
  return out;
}
function imgArt(id, im){
  const loc = (im && im.locator) || '';
  /* 商家提交过的文字整改要能在这张图上看到。
     模板图是按描述排版的，所以先把改动落到描述上；手绘图则直接换图里的字。 */
  const ed = state.matText[id + '::' + loc];
  let src = im;
  if (ed && im){
    src = {};
    for (const k in im) if (Object.prototype.hasOwnProperty.call(im, k)) src[k] = im[k];
    src.description = matApplyEdits(im.description, ed);
  }
  const svg = MATERIAL_ART[id + '::' + loc] || matArt(src);
  if (!svg || !ed) return svg;
  return matApplyEdits(svg, ed);
}
/* 把一条文字整改落到它所在的那张材料图上。
   金标整改清单里的图号与材料顺序不总对得上（C31 把宣传图写成「图3」），
   所以不认图号，认「哪张材料的描述里真的出现了这句话」。返回改到的图号。 */
function applyTextFix(c, from, to){
  if (!from) return '';
  const list = imgsOf(c), hit = [];
  for (let i = 0; i < list.length; i++){
    const im = list[i];
    if (String(im.description || '').indexOf(from) < 0) continue;
    const loc = im.locator || ('图' + (i + 1));
    const k = c.id + '::' + loc;
    if (!state.matText[k]) state.matText[k] = {};
    state.matText[k][esc(from)] = esc(to);
    hit.push(loc);
  }
  return hit.join('、');
}
function imgTypeZh(im){
  return IMG_TYPE_ZH[(im && im.type) || ''] || ((im && im.type) || '材料');
}

function renderImgs(c){
  const box = document.getElementById('imgsBody');
  if (!box) return;
  const list = imgsOf(c);
  const chip = document.getElementById('imgsChip');
  if (chip) chip.textContent = list.length ? (list.length + ' 张材料') : '未上传';
  if (!list.length){
    box.innerHTML = '<div class="imgs-na">本条未提交图片材料——没有图片，就无法做图文互证核对。</div>';
    return;
  }
  box.innerHTML = list.map(function(im, i){
    const art = imgArt(c.id, im);
    const loc = im.locator || ('图' + (i + 1));
    /* 只标「图N」和材料类型：结论标签（如"不成立"）属于分析层，不能贴到商家原图上。
       说明文字一律不进阵列——阵列只放图，文字在放大层里看 */
    return '<figure class="img-th" data-i="' + i + '" tabindex="0" role="button"'
      + ' aria-label="放大查看 ' + esc(loc) + '：' + esc(imgTypeZh(im)) + '">'
      + '<div class="it-top"><span class="it-loc">' + esc(loc) + '</span>'
      + '<span class="it-type">' + esc(imgTypeZh(im)) + '</span></div>'
      + '<div class="it-frame">'
      + (art || '<div class="it-noart">本条暂无预览图</div>')
      + '</div>'
      + '</figure>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.img-th'), function(el){
    const open = function(){ openLightbox(parseInt(el.getAttribute('data-i'), 10)); };
    el.addEventListener('click', open);
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  });
}

/* 放大浮层：只读浏览，不碰任何裁决状态（不开面板、不改动作、不留痕） */
let lbIdx = -1;
function openLightbox(i){
  const list = imgsOf(normalize(CASES[state.id]));
  if (i < 0 || i >= list.length) return;
  lbIdx = i;
  paintLightbox();
  document.getElementById('lb').classList.add('show');
  document.getElementById('lbClose').focus();
}
function closeLightbox(){
  const lb = document.getElementById('lb');
  if (lb) lb.classList.remove('show');
  lbIdx = -1;
}
function lbStep(d){
  const list = imgsOf(normalize(CASES[state.id]));
  const t = lbIdx + d;
  if (t < 0 || t >= list.length) return;
  lbIdx = t;
  paintLightbox();
}
function paintLightbox(){
  const c = normalize(CASES[state.id]);
  const list = imgsOf(c), im = list[lbIdx] || {};
  const loc = im.locator || ('图' + (lbIdx + 1));
  /* 浮层抬头只显示「图N · 类型 + 商品标题」：内嵌数据里的用例 ID 与来源标注属内部标识，不向商家展示 */
  document.getElementById('lbTitle').innerHTML =
      '<b>' + esc(loc) + ' · ' + esc(imgTypeZh(im)) + '</b>'
    + (c.input.title ? '<span class="lb-case">' + esc(c.input.title) + '</span>' : '');
  document.getElementById('lbImg').innerHTML = imgArt(c.id, im) || '<div class="imgs-na">本条暂无预览图</div>';
  document.getElementById('lbSide').innerHTML =
    '<div class="lb-k">商家上传说明</div><div class="lb-d">' + esc(im.description || '—') + '</div>';
  document.getElementById('lbIdx').textContent = (lbIdx + 1) + ' / ' + list.length;
  document.getElementById('lbPrev').disabled = lbIdx <= 0;
  document.getElementById('lbNext').disabled = lbIdx >= list.length - 1;
}
/* 放大浮层：关闭 / 上一张 / 下一张 / 键盘（←→ 翻张、Esc 关闭） */
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', function(){ lbStep(-1); });
document.getElementById('lbNext').addEventListener('click', function(){ lbStep(1); });
document.getElementById('lb').addEventListener('click', function(e){
  if (e.target === this) closeLightbox();
});
document.addEventListener('keydown', function(e){
  const lbEl = document.getElementById('lb');
  if (!lbEl || !lbEl.classList.contains('show')) return;
  if (e.key === 'Escape'){ e.preventDefault(); closeLightbox(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); lbStep(-1); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); lbStep(1); }
});

/* ================= 总渲染 ================= */
function render(){
  const c = currentCase();
  renderShellMeta(); renderPageHead(c); renderSteps(c);

  document.getElementById('colMain').innerHTML =
    renderOriginal(c) + renderReject(c) + renderWhy(c) + renderRules(c);
  bindOrigImgs();

  renderRail(c);
  renderFoot();
  renderActions(c);
}

/* ================= 事件（委托绑定，重渲染后仍生效） ================= */
document.addEventListener('click', function(e){
  /* 顶栏右侧店铺 = 商家角色切换入口 */
  if (e.target.closest('#shopChip')){
    state.shopOpen = !state.shopOpen;
    renderShellMeta();
    return;
  }
  if (!e.target.closest('#shopList') && state.shopOpen){
    state.shopOpen = false;
    renderShellMeta();
  }

  const caseEl = e.target.closest('[data-case]');
  if (caseEl){ resetState(caseEl.getAttribute('data-case')); render(); return; }

  /* 操作按钮要先于待办勾选判断：上传按钮本身就在待办条目内部 */
  const act = e.target.closest('[data-act]');
  if (act){
    const a = act.getAttribute('data-act');
    if (a === 'up'){ state.pendingKey = act.getAttribute('data-key') || ''; document.getElementById('fileInput').click(); }
    else if (a === 'fixsubmit'){
      /* 文字整改：提交后这条算处理完，并把改动同步到上方那份材料图上 */
      const key = act.getAttribute('data-key');
      const box = document.querySelector('.fix-input[data-key="'+key+'"]');
      const orig = box ? (box.getAttribute('data-orig') || '') : '';
      const val = box ? String(box.value || '').trim() : '';
      state.edits[key] = val;
      state.checked[key] = true;
      if (!val || val === orig){
        state.sent[key] = '内容未改动（已确认）';
      } else {
        const hit = applyTextFix(currentCase(), orig, val);
        state.sent[key] = (orig ? '「'+orig+'」→「'+val+'」' : '「'+val+'」') + (hit ? '（已更新 '+hit+'）' : '');
      }
      render();
    }
    else if (a === 'submit'){
      state.submitted = true;
      /* 整页重渲染：步骤条与右栏进度卡都得跟着「已提交」走，不能只改底部那句提示 */
      render();
      /* 主句与底部提示条同一口径；括号那句照右上角那个入口的名字写，访客才找得到 */
      showToast('整改与补证已提交，等待平台复判。',
                '右上角「切换商家店铺」可换一个商品，体验另一种情况。');
    }
    else if (a === 'draft'){
      const t = act.textContent;
      act.textContent = '已暂存';
      setTimeout(function(){ act.textContent = t; }, 1400);
    } else if (a === 'appeal'){
      const box = document.getElementById('appealBox') || document.getElementById('ruleCard');
      if (box) box.scrollIntoView({behavior:'smooth', block:'center'});
    }
    return;
  }

  /* 在输入框里点选、编辑属于「改内容」，不应触发整条勾选 */
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;

  const todo = e.target.closest('.todo');
  if (todo){
    const key = todo.getAttribute('data-key');
    state.checked[key] = !state.checked[key];
    todo.classList.toggle('done', !!state.checked[key]);
    renderProgress();
    return;
  }

  if (e.target.closest('#ruleLink')){
    const rc = document.getElementById('ruleCard');
    if (rc) rc.scrollIntoView({behavior:'smooth', block:'start'});
  }
});

document.getElementById('fileInput').addEventListener('change', function(e){
  const key = state.pendingKey;
  const picked = Array.prototype.slice.call(e.target.files).map(function(f){ return {name:f.name, key:key}; });
  /* 每次上传都归属到某一条待办，只替换该条已选的文件 */
  state.files = state.files.filter(function(f){ return f.key !== key; }).concat(picked);
  /* 换了图就等于把这条改完了，同样不用回去打勾 */
  if (key.indexOf('fix') === 0) state.checked[key] = true;
  state.pendingKey = '';
  e.target.value = '';
  render();
});

resetState('C31');
render();
